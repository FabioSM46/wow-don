[package]
name = "wow-don"
version = "0.1.0"
description = "World of Warcraft addon manager for Linux, Windows and macOS"
authors = ["FabioSM46 <124870035+FabioSM46@users.noreply.github.com>"]
edition = "2024"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wow_don_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "blocking"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-autostart = "2"

# Reads `InstallPath` from the registry for the installation search (D30).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"


# `tauri dev` uses this profile: without optimizations the addon scan (fingerprints of hundreds
# of MB of files), zip extraction and TLS are an order of magnitude slower.
# The project's own code stays at `opt-level = 1` so compilation does not get too long.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
