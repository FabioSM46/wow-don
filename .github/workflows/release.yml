name: Release

# Builds the distributable packages (D24) for a version tag and attaches them to a
# DRAFT GitHub Release: the .deb on Linux, the NSIS installer on Windows and a
# universal (Apple Silicon + Intel), unsigned and unnotarized .dmg on macOS. Nothing
# is published automatically — a human reviews the draft and publishes it.
#
# A tag is accepted only on a commit already on `main`: that commit reached `main`
# through a pull request with a green `ci-gate`, so no package is ever built from
# code that skipped the gates. The `verify` job enforces it before anything builds.
#
# Each package is built on its own platform: Tauri does not cross-build the Windows
# installer from Linux. The bundle targets come from tauri.linux.conf.json,
# tauri.windows.conf.json and tauri.macos.conf.json; `--bundles` repeats them so a
# config change cannot silently produce a different package here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag points at a commit that is not on main. Tag a commit on main, which has passed ci-gate."
            exit 1
          fi
          echo "Tagged commit is on main."

  linux:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: |
          bash scripts/apt-install-with-fallback.sh libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the .deb
        run: pnpm tauri build --bundles deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the NSIS installer
        run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # One universal .dmg for Apple Silicon and Intel: the toolchain pinned in
  # rust-toolchain.toml gets both Apple targets, and Tauri merges the two binaries
  # with lipo. Not signed nor notarized (D24): Gatekeeper asks to confirm the first
  # launch, as README.md explains.
  macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the universal .dmg
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # The only job that can write: it creates the draft release from the three artifacts.
  draft:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No `name:`: every artifact of the run (linux-deb, windows-nsis, macos-dmg) is
      # downloaded and merged into packages/, which `packages/*` below uploads whole.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l packages
          # A re-run, or a tag moved and pushed again, finds the draft already there:
          # replace its packages. A release that is already published is never touched.
          if is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to replace its packages."
              exit 1
            fi
            gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" packages/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "WoW-don $TAG" \
              --notes "Pacchetti per Linux (.deb), Windows (installer) e macOS (.dmg universale, non firmato). Bozza da rivedere prima della pubblicazione."
          fi
