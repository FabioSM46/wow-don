name: Feature (for maintainers)
description: A refined feature, structured for the development pipeline. To propose an idea, use "Suggest a feature"
title: "[Feature]: "
labels: ["feature", "needs-refinement"]
assignees: []
body:
  - type: dropdown
    id: workspace
    attributes:
      label: Area
      description: Which part of the repository does it touch?
      options:
        - backend (Rust / Tauri)
        - frontend (React / TypeScript)
        - shared (Cross-cutting)
      default: 0
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Decides the branch prefix and the commit type
      options:
        - feature (New feature)
        - enhancement (Improvement to an existing feature)
        - refactor (Restructuring with no behaviour change)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is it?
      options:
        - high (Blocks other work)
        - medium (Normal priority)
        - low (Useful but not urgent)
      default: 1
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: User story
      description: In the form "As a [role], I want [goal], so that [reason]". Be precise, the agent reads it literally.
      placeholder: |
        As a player who runs WoW inside a Wine prefix
        I want to add the `_classic_beta_` folder by hand
        so that the app reads the addons of that version
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Conditions verifiable as pass/fail. No vague items like "works well".
      placeholder: |
        - [ ] A `_<flavor>_` folder can be chosen from the file picker
        - [ ] A folder without `Interface/AddOns` is rejected with a clear message
        - [ ] The added installation stays saved after the app restarts
    validations:
      required: true

  - type: textarea
    id: technical_context
    attributes:
      label: Technical context
      description: |
        **REQUIRED**. It is the agent's main guide.
        Suggested subsections: Files to modify, Patterns to follow, Constraints.
      placeholder: |
        ### Files to modify
        - src-tauri/src/installations.rs (new module)
        - src-tauri/src/commands.rs (`add_installation` command)
        - src/App.tsx (button and list)

        ### Patterns to follow
        - Tauri commands return a serializable `Result<T, String>`

        ### Constraints
        - Network, disk and keys only in the backend
        - No new dependencies (crates or npm packages) without discussing it
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: |
        **REQUIRED**. What this issue does NOT cover.
        Keeps the agent from doing more than needed.
      placeholder: |
        - Do not implement automatic discovery of Lutris prefixes (separate issue)
        - Do not read `.toc` files yet
    validations:
      required: true

  - type: textarea
    id: code_pointers
    attributes:
      label: Code pointers
      description: |
        `file:line` references to existing code to read first.
      placeholder: |
        - src-tauri/src/lib.rs:10 (command registration)
        - src-tauri/src/config.rs:5 (configuration loading)
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues, PRs or configuration that must be completed first.
      placeholder: |
        - Requires #12 (persistent local state)
    validations:
      required: false

  - type: textarea
    id: test_strategy
    attributes:
      label: Test strategy
      description: What to test, edge cases and how to verify the result.
      placeholder: |
        - Unit test: a folder without `Interface/AddOns` is rejected
        - Edge case: path with spaces inside `drive_c/Program Files (x86)`
    validations:
      required: false
