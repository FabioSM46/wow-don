name: Bug (for maintainers)
description: A triaged bug, structured for the development pipeline. To report a problem, use "Report a bug"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: dropdown
    id: workspace
    attributes:
      label: Area
      description: Which part of the repository is involved?
      options:
        - backend (Rust / Tauri)
        - frontend (React / TypeScript)
        - shared (Cross-cutting)
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: The observed behaviour. Include exact error messages, panics and stack traces.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      description: The correct behaviour, precise enough to derive a test from it.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Ordered steps. The agent tries to reproduce the bug before fixing it.
      placeholder: |
        1. Add the `_classic_beta_` installation inside the Lutris prefix
        2. Open the list of installed addons
        3. The addon with two `.toc` files appears twice
    validations:
      required: true

  - type: textarea
    id: technical_context
    attributes:
      label: Technical context
      description: |
        **REQUIRED**. Logs, errors and the code paths involved.
      placeholder: |
        Log:
        ```
        thread 'main' panicked at src-tauri/src/addons/toc.rs:42:18
        ```

        Relevant files:
        - src-tauri/src/addons/toc.rs (origin of the panic)
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: |
        **REQUIRED**. What this fix must NOT touch.
      placeholder: |
        - Do not rewrite the `.toc` parser
        - Do not touch the CurseForge client
    validations:
      required: true

  - type: textarea
    id: code_pointers
    attributes:
      label: Code pointers
      description: |
        `file:line` references to read first. Format `path/to/file.rs:42`.
      placeholder: |
        - src-tauri/src/addons/toc.rs:42 (origin of the error)
    validations:
      required: false
